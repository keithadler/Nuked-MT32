name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS (CoreMIDI)", os: macos-latest }
          - { name: "Linux (ALSA)",     os: ubuntu-latest }
          - { name: "Windows (winmm)",  os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libasound2-dev libgl1-mesa-dev

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install sdl2:x64-windows

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release -j 4

      # The self test needs copyrighted Roland firmware, which is not in this
      # repository and never will be, so CI cannot check emulation output.
      # It can still prove the binaries actually RUN on each platform and
      # behave correctly when handed something that is not a ROM.
      - name: Run the tools
        shell: bash
        run: |
          set -e
          EXE=""
          [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          BIN=build
          [ -d build/Release ] && BIN=build/Release

          echo "--- --help must succeed ---"
          "$BIN/mt32-render$EXE" --help > /dev/null
          "$BIN/mt32-romid$EXE"  > /dev/null || true

          echo "--- mt32-romid must identify a non-ROM as unusable ---"
          printf 'this is not a rom' > notarom.bin
          out=$("$BIN/mt32-romid$EXE" notarom.bin)
          echo "$out"
          echo "$out" | grep -q "not usable by this core"
          echo "$out" | grep -q "0 usable control ROM"

          echo "--- a wrong-sized control ROM must fail loudly, not silently ---"
          head -c 4096 /dev/urandom > bad.rom
          if "$BIN/mt32-selftest$EXE" bad.rom bad.rom > sel.txt 2>&1; then
            echo "FAIL: selftest exited 0 on a bad ROM"; cat sel.txt; exit 1
          fi
          cat sel.txt
          grep -q "expected" sel.txt

          echo "--- SysEx validation must reject a malformed MIDI file ---"
          python3 -c "import struct; trk=b'\\x00\\xf0\\x41\\x10\\x16\\x12\\x20\\x00\\x00\\x01\\xf7'+b'\\x00\\xff\\x2f\\x00'; open('bad.mid','wb').write(b'MThd'+struct.pack('>IHHH',6,0,1,480)+b'MTrk'+struct.pack('>I',len(trk))+trk)"
          "$BIN/mt32-render$EXE" -c bad.rom -p bad.rom -m bad.mid -o /dev/null > r.txt 2>&1 || true
          cat r.txt

          echo "all tool checks passed on $RUNNER_OS"
