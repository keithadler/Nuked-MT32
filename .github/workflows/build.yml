name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS (CoreMIDI)", os: macos-latest }
          - { name: "Linux (ALSA)",     os: ubuntu-latest }
          - { name: "Windows (winmm)",  os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libasound2-dev libgl1-mesa-dev

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install sdl2:x64-windows

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release -j 4

      # The self test needs copyrighted Roland firmware, which is not in this
      # repository and never will be. CI can only prove that it builds.
      - name: Check tools respond
        shell: bash
        run: |
          find build -name 'mt32-romid*' -type f -perm -u+x -exec {} \; || true
