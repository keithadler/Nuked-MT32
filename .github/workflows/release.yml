name: release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macos-arm64",   os: macos-latest,   asset: nuked-mt32-macos-arm64 }
          - { name: "linux-x86_64",  os: ubuntu-latest,  asset: nuked-mt32-linux-x86_64 }
          - { name: "windows-x64",   os: windows-latest, asset: nuked-mt32-windows-x64 }

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libasound2-dev libgl1-mesa-dev

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install sdl2:x64-windows

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build build --config Release -j 4

      - name: Stage
        shell: bash
        run: |
          set -e
          OUT="${{ matrix.asset }}"
          mkdir -p "$OUT"
          BIN=build
          [ -d build/Release ] && BIN=build/Release
          EXE=""
          [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          for t in nuked-mt32 mt32-render mt32-romid mt32-selftest; do
            cp "$BIN/$t$EXE" "$OUT/"
          done
          cp README.md FINDINGS.md LICENSE "$OUT/"
          cp munt/README.md "$OUT/REVERB-LICENSING.md"
          # SDL2 runtime for Windows so the GUI starts on a clean machine
          if [ "$RUNNER_OS" = "Windows" ]; then
            find "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" -name 'SDL2.dll' -exec cp {} "$OUT/" \; || true
          fi
          cat > "$OUT/READ-ME-FIRST.txt" <<'TXT'
          Nuked-MT32

          No ROM images are included. They are copyrighted Roland firmware -
          supply your own, dumped from hardware you own.

          Both machines are supported, detected from the control ROM size:
            64 KiB  = MT-32 v1.xx (old)  - what the DOS game catalogue was voiced on
            128 KiB = MT-32 v2.xx (new)
          The PCM ROM is 512 KiB and is shared by both.

          Not sure what you have?      mt32-romid <files...>
          Run it:                      nuked-mt32 -c CONTROL.ROM -p PCM.ROM
          Render a MIDI file offline:  mt32-render -c CONTROL.ROM -p PCM.ROM -m song.mid -o out.wav

          Reverb is Munt's behavioural model, not emulation of the real reverb
          chip, which has never been decapped. It is on by default; --reverb=off
          gives the raw digital output.

          The MT-32 puts parts 1-8 on MIDI channels 2-9 and rhythm on 10.
          Channel 1 is unassigned, so notes sent there are correctly ignored.

          Read FINDINGS.md for what is and is not accurate.
          TXT
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$OUT.zip" "$OUT"
          else
            tar czf "$OUT.tar.gz" "$OUT"
          fi

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
          fail_on_unmatched_files: false
